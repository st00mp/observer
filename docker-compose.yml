services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: syntinel-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pswd
      POSTGRES_DB: syntineldb
    volumes:
      - postgres_data:/var/lib/postgresql/data/syntinel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Crawl4AI Service
  syntinel-crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: syntinel-crawl4ai
    ports:
      - "8001:11235"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Syntinel Core - Central Service
  syntinel-core:
    build:
      context: .
      dockerfile: ./core/syntinel/Dockerfile
    container_name: syntinel-core
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:pswd@syntinel-postgres:5432/syntineldb
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CRAWL4AI_URL=http://syntinel-crawl4ai:8000
      - WRITER_AGENT_URL=http://syntinel-writer-agent:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      syntinel-crawl4ai:
        condition: service_started
      writer-agent:
        condition: service_started
    restart: unless-stopped

  # Writer Agent with CrewAI
  writer-agent:
    build:
      context: ./services/writer-agent
    container_name: syntinel-writer-agent
    ports:
      - "8002:8000"
    environment:
      - CREWAI_MODEL_NAME=gpt-4  # Can be configured based on your preferences
      - CREWAI_API_KEY=${OPENAI_API_KEY}  # This will use the OPENAI_API_KEY from your environment
    restart: unless-stopped
    volumes:
      - ./services/writer-agent/templates:/app/templates

  # Telegram Bot Service
  telegram-bot:
    build:
      context: ./services/telegram-bot
    container_name: syntinel-telegram-bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OBSERVER_CORE_URL=http://syntinel-core:8000
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=pswd
      - POSTGRES_DB=syntineldb
    depends_on:
      - syntinel-core
      - postgres
    restart: unless-stopped
    
  # pgAdmin for Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: syntinel-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@syntinel.com
      PGADMIN_DEFAULT_PASSWORD: pswd
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

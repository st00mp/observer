# Configuration d'extraction par défaut pour crawl4ai
# Extraction basée sur CSS
selector_strategy: "css"
selectors:
  title: "h1, .article-title, .post-title"
  content: "article, .post-content, .article-content, main"
  author: ".author, .byline"
  date: ".date, .published-date, time"
  image: ".featured-image img, article img:first-of-type"
  
clean_content: true
strip_html_comments: true
keep_formatting: true
remove_empty_elements: true

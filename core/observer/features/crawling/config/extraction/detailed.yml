# Configuration d'extraction détaillée pour crawl4ai
# Extraction basée sur LLM
extraction_strategy: "llm"
llm_config:
  model: "gpt-3.5-turbo"  # ou autre modèle disponible dans votre installation
  temperature: 0.3
  
extraction_prompt: |
  Extrais les informations suivantes de l'article:
  - Le titre principal
  - Le contenu complet de l'article
  - L'auteur ou les auteurs
  - La date de publication (format ISO)
  - Les tags ou catégories
  - Un résumé de 3 phrases
  - Les citations importantes
  - Les liens externes mentionnés
  
keep_formatting: true
clean_content: true
extract_images: true
extract_tables: true
extract_code_blocks: true

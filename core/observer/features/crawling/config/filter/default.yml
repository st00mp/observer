# Configuration de filtrage par défaut pour crawl4ai
remove_boilerplate: true
remove_navigation: true
remove_ads: true
remove_sidebars: true
remove_footers: true
remove_comments: true

# Filtres de contenu
min_content_length: 100
block_patterns:
  - "cookie consent"
  - "subscribe to our newsletter"
  - "sign up for updates"
  - "accept all cookies"
  - "privacy policy"
  
# Nettoyage du HTML
clean_attributes:
  - "style"
  - "onclick"
  - "onload"
  - "data-*"
  
preserve_elements:
  - "h1"
  - "h2"
  - "h3"
  - "p"
  - "ul"
  - "ol"
  - "li"
  - "img"
  - "code"
  - "pre"
  - "table"

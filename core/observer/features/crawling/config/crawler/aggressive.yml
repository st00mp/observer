# Configuration du crawler agressif pour crawl4ai
cache_mode: "bypass"
wait_until: "load"
page_timeout: 15000
delay_before_return_html: 0.2
word_count_threshold: 100
scan_full_page: true
scroll_delay: 0.1
process_iframes: true
remove_overlay_elements: true
magic: true
verbose: true
enable_rate_limiting: false
max_session_permit: 30
